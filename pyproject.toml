[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-art-lib"
version = "1.0.0"
description = "Быстрая конвертация изображений и анимаций (GIF/видео) в цветной ASCII-арт для консоли"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ascii-art project" }]
keywords = ["ascii", "ascii-art", "image-to-ascii", "gif", "video", "ansi", "terminal"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screenshots",
    "Topic :: Text Processing",
]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.8",
    "Pillow>=9.0",
    "progress>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
asciiart = "ascii_art_lib.cli:main"

[tool.setuptools.packages.find]
include = ["ascii_art_lib*"]
